name: keep the schedule alive
# GitHub pauses scheduled workflows after 60 days without repository activity; this touches the repo monthly.
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%MZ > .last-heartbeat
          git config user.name "uptime-bot"; git config user.email "uptime-bot@users.noreply.github.com"
          git add .last-heartbeat && git commit -m "heartbeat" && git push
